name: CI

on:
  push:
    branches: [main, "feature/**", "feat/issue-29-application-runtime"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps --package-lock=false
      - name: Format source files
        run: npx prettier --write "src/**/*.{js,css}" "*.{js,json,html}"
      - name: Run quality checks
        run: npm run check
      - name: Commit formatter changes
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Apply Prettier formatting"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
