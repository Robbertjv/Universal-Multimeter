name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps --package-lock=false
      - name: Format diagnostic
        run: |
          npx prettier --write src/components/universal-multimeter-app.js src/components/universal-multimeter-app.test.js src/data/measurement-history-store.js src/drivers/uni-t-ut61-bcd-driver.js src/drivers/uni-t-ut61-bcd-driver.test.js src/drivers/uni-t-ut61-bcd-profile.js src/styles.css
          git diff -- src/components/universal-multimeter-app.js src/components/universal-multimeter-app.test.js src/data/measurement-history-store.js src/drivers/uni-t-ut61-bcd-driver.js src/drivers/uni-t-ut61-bcd-driver.test.js src/drivers/uni-t-ut61-bcd-profile.js src/styles.css
      - name: Run quality checks
        run: npm run check
