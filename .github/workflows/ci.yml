name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps --package-lock=false
      - name: Temporary Prettier preview
        run: |
          npx prettier --write src/core/web-hid-transport.js src/core/web-hid-transport.test.js
          git diff -- src/core/web-hid-transport.js src/core/web-hid-transport.test.js
      - name: Run quality checks
        run: npm run check