name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps --package-lock=false
      - name: Format foundation files for verification
        run: npm run format
      - name: Show formatter changes
        run: git diff -- package.json index.html vite.config.js eslint.config.js .prettierrc.json src
      - name: Run quality checks
        run: npm run check