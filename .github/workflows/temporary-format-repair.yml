name: Temporary format repair
on:
  push:
    branches: ["feature/issue-6-transport-contract"]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/issue-6-transport-contract
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund --legacy-peer-deps --package-lock=false
      - run: npm run format
      - name: Commit formatted source
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "style(core): format transport runtime"
          git push origin HEAD:feature/issue-6-transport-contract
